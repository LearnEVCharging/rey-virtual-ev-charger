# Render blueprint — one-click deploy.
# Render → New → Blueprint → pick this repo → Apply.
# (Or: New → Web Service → this repo → Build `npm install`, Start `npm start`.)
services:
  - type: web
    name: rey-virtual-charger
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
